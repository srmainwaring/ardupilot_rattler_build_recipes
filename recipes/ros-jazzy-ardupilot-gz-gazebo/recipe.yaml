context:
  name: ardupilot-gz-gazebo
  version: "0.1.0"
  distro: jazzy
  gz_version: jetty

package:
  name: ros-${{ distro }}-${{ name }}
  version: ${{ version }}

source:
  git: https://github.com/ArduPilot/ardupilot_gz.git
  rev: 8df4dc1726e37504e6fc8b952d02e554cfa3176f

build:
  number: 0
  script:
    env:
      GZ_VERSION: ${{ gz_version }}
    content:
      - |
        cmake -S $SRC_DIR/ardupilot_gz_gazebo -B build -G "Ninja" \
          -DCMAKE_INSTALL_PREFIX=$PREFIX \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -DBUILD_SHARED_LIBS=ON \
          -DPython3_EXECUTABLE=$PREFIX/bin/python \
          -DCMAKE_INSTALL_LIBDIR=lib \
      - cmake --build build --target install

requirements:
  build:
    - python >=3.12,<3.13
  host:
    - compilers
    - cmake
    - ninja
    - python >=3.12,<3.13
    - ros-${{ distro }}-ament-cmake
    - ros-${{ distro }}-ament-cmake-copyright
    - ros-${{ distro }}-ament-cmake-cppcheck
    - ros-${{ distro }}-ament-cmake-cpplint
    - ros-${{ distro }}-ament-cmake-flake8
    - ros-${{ distro }}-ament-cmake-lint-cmake
    - ros-${{ distro }}-ament-cmake-mypy
    - ros-${{ distro }}-ament-cmake-pep257
    - ros-${{ distro }}-ament-cmake-xmllint
    - ros-${{ distro }}-ament-lint-auto
    - ros-${{ distro }}-ament-lint-common
    - ros-${{ distro }}-gz-common-vendor
    - ros-${{ distro }}-gz-cmake-vendor
    - ros-${{ distro }}-gz-plugin-vendor
    - ros-${{ distro }}-gz-sim-vendor = 0.4.4
  run:
    - python >=3.12,<3.13
    - ros-${{ distro }}-gz-sim-vendor = 0.4.4

tests:
  - script: []


about:
  homepage: https://github.com/ArduPilot/ardupilot_gz
  summary: About
    Tools for ArduPilot ROS2 integration and testing on ROS 2
  description: |
    This project contains ROS 2 packages for simulating models controlled
    by ArduPilot SITL with DDS support in Gazebo.
  license: GPL-3.0-only
