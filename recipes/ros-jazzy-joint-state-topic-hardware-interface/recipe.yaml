context:
  name: joint-state-topic-hardware-interface
  version: "1.0.0"
  distro: jazzy

package:
  name: ros-${{ distro }}-${{ name }}
  version: ${{ version }}

source:
  git: https://github.com/ros-controls/topic_based_hardware_interfaces.git
  tag: ${{ version }}
  expected_commit: 46bbac4cde5ea23dbd0aff2ab599fffc261c4ed1

build:
  number: 0
  script:
    - |
      cmake -S ${SRC_DIR}/joint_state_topic_hardware_interface -B build -G "Ninja" \
        -DCMAKE_INSTALL_PREFIX=$PREFIX \
        -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
        -DBUILD_SHARED_LIBS=ON \
        -DPython3_EXECUTABLE=$PREFIX/bin/python \
        -DCMAKE_INSTALL_LIBDIR=lib \
        -DBUILD_TESTING=OFF \
    - cmake --build build --target install

requirements:
  build:
    - python >=3.12,<3.13
  host:
    - compilers
    - cmake
    - ninja
    - python >=3.12,<3.13
    - ros-${{ distro }}-ament-cmake
    - ros-${{ distro }}-angles
    - ros-${{ distro }}-ros2-control-cmake
    - ros-${{ distro }}-rclcpp
    - ros-${{ distro }}-hardware-interface
    - ros-${{ distro }}-pal-statistics-msgs
    - ros-${{ distro }}-sensor-msgs

  run:
    - python >=3.12,<3.13

tests:
  - script: []


about:
  homepage: https://github.com/ros-controls/topic_based_hardware_interfaces
  summary: A ros2_control hardware component using ROS topics
  description: |
    The Joint State Topic Based System implements a ros2_control
    hardware_interface::SystemInterface supporting command and state
    interfaces through the ROS topic communication layer.
  license: Apache-2.0
  license_file: LICENSE
